[package]
name = "microbit-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
microbit-bsp = { git = "https://github.com/lulf/microbit-bsp.git", rev = "c8bc668", version = "0.5.0" }

embassy-futures = { version = "0.1.1", default-features = false }
embassy-executor = { version = "0.9", default-features = false, features = [
    "arch-cortex-m",
    "defmt",
    "executor-interrupt",
    "executor-thread"
] }

cortex-m-rt = "0.7"

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
defmt = "1.0.1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
post-haste = { version = "0.7.0", path = "../.." }

[profile.release]
debug = 2
