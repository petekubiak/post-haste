[package]
name = "microbit-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.10.0", features = ["gpiote", "nrf52833", "time", "time-driver-rtc1"] }
embassy-time = "0.5.1"
panic-probe = { version = "1.0.0", features = ["print-rtt", "rtt-target"] }
rtt-target = "0.6.2"
